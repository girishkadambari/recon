<VirtualHost *:443>
    ServerName cloud.settleproof.app

    # SSL Configuration (Assuming Let's Encrypt or similar)
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/cloud.settleproof.app/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/cloud.settleproof.app/privkey.pem

    # Serve the Frontend SPA locally at /ui/
    Alias /ui "/var/www/settleproof-ui"
    <Directory "/var/www/settleproof-ui">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA fallback routing handling natively through Apache Mod Rewrite
        RewriteEngine On
        RewriteBase /ui/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /ui/index.html [L]
    </Directory>

    # Optionally redirect root accesses directly to the UI layer
    RewriteEngine On
    RewriteRule ^/$ /ui/ [R=301,L]

    # Preserve Host headers during proxying for internal JWT/Session URL mappings
    ProxyPreserveHost On

    # Proxy API Core to the FastAPI Backend
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Proxy Swagger UI mapping
    ProxyPass /docs http://127.0.0.1:8000/docs
    ProxyPassReverse /docs http://127.0.0.1:8000/docs

    # Proxy OpenAPI JSON
    ProxyPass /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    # Proxy Healthcheck and Ready Checks
    ProxyPass /health http://127.0.0.1:8000/health
    ProxyPassReverse /health http://127.0.0.1:8000/health
    ProxyPass /ready http://127.0.0.1:8000/ready
    ProxyPassReverse /ready http://127.0.0.1:8000/ready

    ErrorLog ${APACHE_LOG_DIR}/settleproof_error.log
    CustomLog ${APACHE_LOG_DIR}/settleproof_access.log combined
</VirtualHost>
